name: Keep Streamlit Awake

on:
  schedule:
    - cron: "*/50 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit App
        run: |
          curl -s -o /dev/null -w "%{http_code}" "${{ secrets.APP_URL }}" || echo "Ping failed"
          echo "App pinged at $(date)"
